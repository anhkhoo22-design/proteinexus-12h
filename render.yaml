services:
  - type: web
    name: proteinexus-12h
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci --omit=dev --omit=optional --ignore-scripts
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: TEACHER_ACTIVATION_CODE
        generateValue: true
      - key: OWNER_ACTIVATION_CODE
        generateValue: true
